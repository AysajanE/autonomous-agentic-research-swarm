                    - img "A diagram of the upgrades and governance" [ref=e1340]
                    - generic [ref=e1341]: A diagram of the upgrades and governance
                  - paragraph [ref=e1344]:
                    - text: All contracts are upgradable by a
                    - code [ref=e1345]: ProxyAdmin
                    - text: contract controlled by a nested 2/2
                    - code [ref=e1346]: Base Governance Multisig
                    - text: composed of the
                    - code [ref=e1347]: Base Coordinator Multisig
                    - text: and the
                    - code [ref=e1348]: Base Security Council
                    - text: . Upgrades require approval from both parties. There is no delay on upgrades. The Guardian role for the SuperchainConfig is assigned to the Base Governance Multisig, which can pause and unpause withdrawals.
                    - code [ref=e1349]: Base Multisig 1
                    - text: serves as Incident Responder and can pause withdrawals but cannot unpause or extend pauses. Each pause automatically expires after 3 months if not extended by the Guardian. The single
                    - link "Sequencer" [ref=e1351] [cursor=pointer]:
                      - /url: /glossary#sequencer
                    - text: actor can be modified by
                    - code [ref=e1352]: Base Multisig 1
                    - text: via the SystemConfig contract. The Base Governance multisig can also recover dispute bonds in case of bugs that would distribute them incorrectly.
