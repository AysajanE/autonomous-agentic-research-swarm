                        - /url: "#exit-mechanisms-1"
                    - paragraph [ref=e1417]:
                      - text: The user initiates the withdrawal by submitting a regular transaction on this chain. When a
                      - link "state root" [ref=e1419] [cursor=pointer]:
                        - /url: /glossary#state-root
                      - text: containing such transaction is settled, the funds become available for withdrawal on
                      - link "L1" [ref=e1421] [cursor=pointer]:
                        - /url: /glossary#layer-1
                      - text: after 3d 12h. Withdrawal inclusion can be proven before
                      - link "state root" [ref=e1423] [cursor=pointer]:
                        - /url: /glossary#state-root
                      - link "settlement" [ref=e1425] [cursor=pointer]:
                        - /url: /glossary#settlement
                      - text: ", but a 7d period has to pass before it becomes actionable. The process of"
                      - link "state root" [ref=e1427] [cursor=pointer]:
                        - /url: /glossary#state-root
                      - link "settlement" [ref=e1429] [cursor=pointer]:
                        - /url: /glossary#settlement
                      - text: takes a
                      - link "challenge period" [ref=e1431] [cursor=pointer]:
                        - /url: /glossary#challenge-period
                      - text: of at least 3d 12h to complete. Finally the user submits an
                      - link "L1" [ref=e1433] [cursor=pointer]:
                        - /url: /glossary#layer-1
                      - text: transaction to claim the funds. This transaction requires a merkle proof.
