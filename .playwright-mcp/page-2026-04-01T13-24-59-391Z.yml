                  - generic [ref=e1216]:
                    - paragraph [ref=e1219]:
                      - text: Updates to the system state can be proposed and challenged by anyone who has sufficient funds. If a
                      - link "state root" [ref=e1221] [cursor=pointer]:
                        - /url: /glossary#state-root
                      - text: passes the
                      - link "challenge period" [ref=e1223] [cursor=pointer]:
                        - /url: /glossary#challenge-period
                      - text: ", it is optimistically considered correct and made actionable for withdrawals."
                    - separator [ref=e1224]
                    - generic [ref=e1225]:
                      - text: State root proposals
                      - paragraph [ref=e1228]:
                        - text: Proposers submit
                        - link "state roots" [ref=e1230] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: as children of the latest confirmed
                        - link "state root" [ref=e1232] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: (called anchor state), by calling the
                        - code [ref=e1233]: create
                        - text: function in the DisputeGameFactory. A
                        - link "state root" [ref=e1235] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: can have multiple conflicting children. Each proposal requires a stake, currently set to 0.08 ETH, that can be slashed if the proposal is proven incorrect via a
                        - link "fraud proof" [ref=e1237] [cursor=pointer]:
                          - /url: /glossary#fraud-proof
                        - text: . Stakes can be withdrawn only after the proposal has been confirmed. A
                        - link "state root" [ref=e1239] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: gets confirmed if the
                        - link "challenge period" [ref=e1241] [cursor=pointer]:
                          - /url: /glossary#challenge-period
                        - text: has passed and it is not countered.
                      - list [ref=e1242]:
                        - listitem [ref=e1243]:
                          - 'link "OP stack specification: Fault Dispute Game" [ref=e1244] [cursor=pointer]':
                            - /url: https://specs.optimism.io/fault-proof/stage-one/fault-dispute-game.html#fault-dispute-game
                    - generic [ref=e1245]:
                      - text: Challenges
                      - paragraph [ref=e1248]:
                        - text: Challenges are opened to disprove invalid
                        - link "state roots" [ref=e1250] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: using bisection games. Each bisection move requires a stake that increases expontentially with the depth of the bisection, with a factor of 1.09493. The maximum depth is 73, and reaching it therefore requires a cumulative stake of 691.43 ETH from depth 0. Actors can participate in any challenge by calling the
                        - code [ref=e1251]: defend
                        - text: or
                        - code [ref=e1252]: attack
                        - text: functions, depending whether they agree or disagree with the latest claim and want to move the bisection game forward. Actors that disagree with the top-level claim are called challengers, and actors that agree are called defenders. Each actor might be involved in multiple (sub-)challenges at the same time, meaning that the protocol operates with
                        - link "full concurrency" [ref=e1253] [cursor=pointer]:
                          - /url: https://medium.com/l2beat/fraud-proof-wars-b0cb4d0f452a
                        - text: . Challengers and defenders alternate in the bisection game, and they pass each other a clock that starts with 3d 12h. If a clock expires, the claim is considered defeated if it was countered, or it gets confirmed if uncountered. Since honest parties can inherit clocks from malicious parties that play both as challengers and defenders (see
                        - link "freeloader claims" [ref=e1254] [cursor=pointer]:
                          - /url: https://specs.optimism.io/fault-proof/stage-one/fault-dispute-game.html#freeloader-claims
                        - text: ), if a clock gets inherited with less than 3h, it generally gets extended by 3h with the exception of 6h right before depth 30, and 1d right before the last depth. The maximum clock extension that a top level claim can get is therefore 10d. Since unconfirmed
                        - link "state roots" [ref=e1256] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: are independent of one another, users can decide to exit with a subsequent confirmed
                        - link "state root" [ref=e1258] [cursor=pointer]:
                          - /url: /glossary#state-root
                        - text: if the previous one is delayed. Winners get the entire losers’ stake, meaning that sybils can potentially play against each other at no cost. The final instruction found via the bisection game is then executed onchain in the MIPS one step
                        - link "prover" [ref=e1260] [cursor=pointer]:
                          - /url: /glossary#prover
                        - text: contract who determines the winner. The protocol does not enforce valid bisections, meaning that actors can propose correct initial claims and then provide incorrect midpoints. The protocol can be subject to resource exhaustion attacks (
                        - link "Spearbit 5.1.3" [ref=e1261] [cursor=pointer]:
                          - /url: https://github.com/ethereum-optimism/optimism/blob/develop/docs/security-reviews/2024_08_Fault-Proofs-No-MIPS_Spearbit.pdf
                        - text: ).
                      - list [ref=e1262]:
                        - listitem [ref=e1263]:
                          - 'link "Fraud Proof Wars: OPFP" [ref=e1264] [cursor=pointer]':
                            - /url: https://medium.com/l2beat/fraud-proof-wars-b0cb4d0f452a
