schema_version: research_swarm.venue.v1
status: reference_implementation
reference_scope: "Reference implementation only; this is not a real submission or a claim of acceptance by an external venue."
target_venue:
  name: "Self-hosted working paper / preprint reference surface"
  kind: working_paper_preprint
  real_submission: false
format:
  source_engine: quarto
  latex_document_class: article
  template: default
  page_limit: null
  word_limit: null
  anonymization: not_applicable_reference_only
  reference_style: author_date
required_statements:
  - ai_use_disclosure
  - data_availability
  - code_availability
  - authorship_contributions
ai_policy:
  disclosed_ai_assistance: permitted_for_reference_distribution
  ai_as_author: prohibited
  allowed_release_modes:
    - mainstream
  ai_native_submission: not_consented
  evidence_pointer: "contracts/venue.yaml#reference_scope"
venue_consent:
  status: reference_distribution_only
  consent_compatible: true
  real_submission_authorized: false
  evidence_pointer: "contracts/venue.yaml#reference_scope"
release:
  mode: mainstream
  supported_modes:
    - mainstream
    - ai_native
  submission_declared: false
  submission_package_requested: false

