{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "research_swarm.release_manifest.v1.schema",
  "type": "object",
  "required": ["schema_version", "release_id", "release_date_utc", "generated_at_utc", "repo", "lifecycle", "task_status", "quality_gates", "artifacts", "counts", "notes"],
  "properties": {
    "schema_version": {"const": "research_swarm.release_manifest.v1"},
    "release_id": {"type": "string", "minLength": 1},
    "release_date_utc": {"type": "string"},
    "generated_at_utc": {"type": "string", "format": "date-time"},
    "repo": {"type": "object", "required": ["git_sha", "project_mode", "catalog_path", "release_manifest_path"]},
    "lifecycle": {"type": "object", "required": ["allowed_states", "scientific_review_role", "runtime_manifest_dir", "judge_review_dir", "release_manifest_pattern"]},
    "task_status": {"type": "object", "required": ["state_counts", "task_ids_by_state", "parse_failures"]},
    "quality_gates": {"type": "object", "required": ["required_gate_names", "all_required_ok", "results"]},
    "artifacts": {"type": "object"},
    "counts": {"type": "object"},
    "notes": {"type": "array"}
  }
}
