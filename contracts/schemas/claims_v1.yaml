$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "research_swarm.claims.v1"
title: "Research Swarm claim-evidence ledger"
type: object
required: [schema_version, claims]
properties:
  schema_version:
    const: "research_swarm.claims.v1"
  description:
    type: string
  claims:
    type: array
    items:
      type: object
      required:
        - claim_id
        - statement
        - type
        - supporting_artifacts
        - verification_command
        - uncertainty_artifact
      properties:
        claim_id: {type: string, minLength: 1}
        statement: {type: string, minLength: 1}
        type:
          enum:
            - descriptive
            - associational
            - causal
            - interpretation
            - methodological
            - theoretical
            - computational
            - counterfactual
            - literature
        supporting_artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/hashed_artifact"
        verification_command: {type: string, minLength: 1}
        uncertainty_artifact:
          anyOf:
            - $ref: "#/$defs/hashed_artifact"
            - type: "null"
        uncertainty_justification: {type: string, minLength: 1}
        hypothesis_id: {type: string, minLength: 1}
        prereg_lock_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        headline: {type: boolean}
        manuscript_numeric_literals:
          type: array
          items: {type: string, minLength: 1}
        recomputation_roles:
          type: object
          minProperties: 1
          additionalProperties: {type: string, minLength: 1}
        citation_key: {type: string, minLength: 1}
        evidence_span: {type: string, minLength: 1}
$defs:
  hashed_artifact:
    type: object
    required: [path, sha256]
    properties:
      path: {type: string, minLength: 1}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    additionalProperties: false
