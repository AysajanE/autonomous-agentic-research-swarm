name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Reproduce analysis
        run: make reproduce-analysis

      - name: Resolve computed paper
        run: make paper

      - name: Run quality gates
        run: make gate

      - name: Run tests
        run: make test

  golden-regression:
    name: Golden regression for prompt/contract surfaces
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect prompt, contract, and gate changes
        id: golden-surface
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(contracts/|docs/prompts/|scripts/(quality_gates|swarm|swarm_taskfile|swarm_events|integrity_audit|generate_disclosure|pack_config|falsify_claims|replication_package)\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.golden-surface.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install project dependencies
        if: steps.golden-surface.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Block golden-set regressions
        if: steps.golden-surface.outputs.run == 'true'
        run: python -m unittest discover -s tests/golden -p 'test_*.py'
